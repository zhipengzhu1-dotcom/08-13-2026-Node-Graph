  if (btn) btn.onclick = () => n.path && window.open("file://" + encodeURI(n.path));
}

/* ---------- controls ---------- */
document.getElementById("q").addEventListener("input", ev => {
  const q = ev.target.value.trim().toLowerCase();
  const box = document.getElementById("results");
  if (!q) { box.innerHTML = ""; return; }
  const hits = nodes.filter(n => (n.title || "").toLowerCase().includes(q) || n.id.toLowerCase().includes(q))
    .sort((a, b) => b.deg - a.deg).slice(0, 12);
  box.innerHTML = hits.map(n => `<div class="hit" data-go="${n.id}">
    <b>${n.title || n.id}</b><span>${n.id} · ${TYPE[n.type].key} · ${n.deg} links</span></div>`).join("")
    || '<div class="sub" style="padding:6px">No match.</div>';
  box.querySelectorAll("[data-go]").forEach(d => d.onclick = () => openNode(byId.get(d.dataset.go)));
});

/* Two kinds of update, deliberately different.

   `settle` is for changing WHAT IS SHOWN. Nodes already on screen keep their
   positions exactly; only nodes arriving for the first time move. Switching a
   space off and on again therefore returns it to where it was.

   `resolve` is for changing THE RULES OF THE SPACE - the shell, the size, the
   ring, 2D, the affinity forces - where every position has to be worked out
   again. */
function settle(iterations = 320) {
  recompute();
  const fresh = new Set(VN.filter(n => !n.placed).map(n => n.id));
  layout(fresh.size ? iterations : 0, fresh);
  draw();
}

function resolve(iterations = 500) {
  placeSpaces();
  nodes.forEach(n => n.placed = false);
  recompute();
  layout(iterations, null);
  draw();
}

spinBox.onchange = e => setSpin(e.target.checked);
document.getElementById("labels").onchange = e => { showLabels = e.target.checked; draw(); };
document.getElementById("flat").onchange   = e => { flat = e.target.checked; pitch = flat ? 0 : PITCH0; yaw = flat ? 0 : 0.6; resolve(); };
document.getElementById("onlyLinked").onchange = e => { hideIsolated = e.target.checked; settle(); };
document.getElementById("alpha").oninput   = e => { edgeAlpha = e.target.value / 100; draw(); };
document.getElementById("affinity").onchange = e => { useAffinity = e.target.checked; resolve(); };

/* The test controls are a popover: CSS transitions carry it in and out, so a
   second click mid-animation reverses it from where it is. */
const lab = document.getElementById("lab");
document.getElementById("labToggle").onclick = () => lab.classList.toggle("closed");
document.getElementById("labClose").onclick = () => lab.classList.add("closed");
/* Phone: the filters drawer and the detail sheet. */
document.getElementById("navBtn").onclick = () => document.body.classList.toggle("nav-open");
document.getElementById("scrim").onclick = () => document.body.classList.remove("nav-open");
document.getElementById("sheetClose").onclick = () => select(null);
document.getElementById("shellSeg").onclick = ev => {
  const b = ev.target.closest("[data-shell]");
  if (!b) return;
  shellShape = b.dataset.shell;
  [...b.parentNode.children].forEach(x => x.classList.toggle("on", x === b));
  resolve();
};
document.getElementById("spaceSize").oninput = e => {
  sizeK = e.target.value / 100;
  document.getElementById("spaceSizeVal").textContent = `${e.target.value}%`;
  resolve(260);
};
document.getElementById("ringSize").oninput = e => {
  ringR = +e.target.value;
  document.getElementById("ringSizeVal").textContent = e.target.value;
  resolve(260);
};
document.getElementById("styleSeg").onclick = ev => {
  const b = ev.target.closest("[data-style]");
  if (!b) return;
  style = b.dataset.style;
  [...b.parentNode.children].forEach(x => x.classList.toggle("on", x === b));
  document.documentElement.dataset.style = style;
  readColors();
  buildClusterList();
  // Obsidian's web only reads at low opacity; ink on paper needs more.
  const a = document.getElementById("alpha");
  a.value = obs() ? 18 : 30;
  edgeAlpha = a.value / 100;
  resolve();   // the spring rules changed, so the layout must be re-solved
};
document.getElementById("confine").onchange = e => { confine = e.target.checked; resolve(); };
document.getElementById("shells").onchange = e => { showShells = e.target.checked; draw(); };
document.getElementById("axes").onchange = e => { showAxes = e.target.checked; draw(); };
document.getElementById("bycluster").onchange = e => { colourBy = e.target.checked ? "cluster" : "type"; draw(); };

/* The cluster legend names each community by its heaviest member, which is
   almost always the document the rest of the group hangs off. A cluster is
   worked out from every link, so most of them span more than one space. */
function buildClusterList() {
  const box = document.getElementById("clusterList");
  box.innerHTML = bigClusters.slice(0, 10).map(lab => {
    const members = nodes.filter(n => cluster.get(n.id) === lab);
    const lead = members.slice().sort((a, b) => b.deg - a.deg)[0];
    const spaces = new Set(members.map(m => TYPE[m.type].key)).size;
    const i = clusterIndex.get(lab);
    return `<div class="hit" data-go="${lead.id}" title="${members.length} documents in ${spaces} space(s)">
      <b style="font-size:13px"><span class="swatch" style="display:inline-block;background:${
        clusterHue(i)}"></span> ${(lead.title || lead.id).slice(0, 26)}</b>
      <span>${members.length} documents · ${spaces} space${spaces === 1 ? "" : "s"}</span></div>`;
  }).join("");
  box.querySelectorAll("[data-go]").forEach(d => d.onclick = () => openNode(byId.get(d.dataset.go)));
}
document.getElementById("reset").onclick = () => {
  stage = null; selected = null; zoom = camZoom = 1; panX = panY = 0;
  look = { x: 0, y: 0, z: 0 }; camLook = { x: 0, y: 0, z: 0 };
  camPan = { x: 0, y: 0 }; snapCamera();
  yaw = 0.6; pitch = flat ? 0 : PITCH0; dist = DIST0;
  markStage(); select(null); resolve();
};

buildSpaceList();
buildClusterList();
setSpin(spin);
// The web fonts are optional. When they arrive, the canvas text is redrawn in them.
document.fonts && document.fonts.ready.then(() => draw());
window.addEventListener("resize", () => { resize(); draw(); });
resize();
recompute();
layout(700, null);
select(null);
tick();
</script>
</body>
</html>
