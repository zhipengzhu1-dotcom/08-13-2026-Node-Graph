<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Example Labs — Five Spaces</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #11151d; --line: #222a38; --ink: #e6edf3;
    --dim: #8b949e; --accent: #58a6ff;
    --sop: #58a6ff; --form: #3fb950; --ap: #d29922; --tm: #f85149; --inst: #bc8cff;
    --web: #2e8b8b;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6f9; --panel: #ffffff; --line: #d6dce4; --ink: #1f2328;
      --dim: #656d76; --accent: #0969da;
      --sop: #0969da; --form: #1a7f37; --ap: #9a6700; --tm: #cf222e; --inst: #8250df;
      --web: #6aa9a9;
    }
  }
  /* Obsidian style brings its own palette: a near-black ground, a teal web,
     and fluorescent nodes. It overrides the light theme too - this look only
     works dark, so it stays dark whatever the operating system says. */
  :root[data-style="obsidian"] {
    --bg: #0e1014; --panel: #14171d; --line: #232833; --ink: #e9eef7;
    --dim: #78838f; --accent: #ffd93d;
    --sop:  #ffd93d;   /* fluorescent yellow - the backbone procedures */
    --form: #8ea9ff;   /* periwinkle - the numerous small records */
    --ap:   #4ff0d0;   /* aqua */
    --tm:   #ff5c7a;   /* neon red - documents that do not exist */
    --inst: #ff6ec7;   /* hot magenta - the instruments */
    --web:  #2fb8a8;   /* the teal web */
  }
  :root[data-style="obsidian"] .seg button.on,
  :root[data-style="obsidian"] button.primary,
  :root[data-style="obsidian"] .pill { color: #0e1014; }
  :root[data-style="obsidian"] button.primary:hover { color: #0e1014; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: grid; grid-template-columns: 262px 1fr 330px; overflow: hidden;
  }
  aside { background: var(--panel); overflow-y: auto; padding: 16px; }
  aside.left { border-right: 1px solid var(--line); }
  aside.right { border-left: 1px solid var(--line); }
  h1 { font-size: 14px; margin: 0 0 2px; }
  .sub { color: var(--dim); font-size: 11px; }
  h2 { font-size: 10px; text-transform: uppercase; letter-spacing: .09em;
       color: var(--dim); margin: 20px 0 8px; font-weight: 600; }
  input[type=search] {
    width: 100%; padding: 7px 9px; background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; font: inherit; margin-top: 14px;
  }
  input[type=search]:focus { outline: none; border-color: var(--accent); }
  label { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  label:hover { color: var(--accent); }
  .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .count { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; font-size: 11px; }
  .edgekey { width: 20px; border-top: 2px solid var(--dim); flex: none; }
  .edgekey.dash { border-top-style: dashed; }
  .hit { padding: 5px 7px; border-radius: 5px; cursor: pointer; }
  .hit:hover { background: var(--bg); }
  .hit b { display: block; font-weight: 600; }
  .hit span { color: var(--dim); font-size: 11px; }

  /* One row per space. The name is a button: it centres the view on that
     space. The checkbox shows and hides the whole space. */
  .space { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 5px; }
  .space:hover { background: var(--bg); }
  .space .nm { font-weight: 600; cursor: pointer; }
  .space .nm:hover { color: var(--accent); }
  .space .ct { margin-left: auto; color: var(--dim); font-size: 11px;
               font-variant-numeric: tabular-nums; white-space: nowrap; }
  .space.off { opacity: .45; }
  .space.open { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .space.open .nm { color: var(--accent); }
  .legend { color: var(--dim); font-size: 10px; padding: 2px 6px 6px; display: flex; }
  .legend span { margin-left: auto; }
  .waiting { color: var(--dim); font-size: 11px; padding: 8px 6px 0; line-height: 1.45; }
  .waiting b { color: var(--ink); font-variant-numeric: tabular-nums; }

  main { position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.grabbing { cursor: grabbing; }
  #hud { position: absolute; left: 14px; bottom: 12px; color: var(--dim);
         font-size: 11px; font-variant-numeric: tabular-nums; pointer-events: none; }
  #hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: 34px;
          color: var(--dim); font-size: 11px; pointer-events: none; white-space: nowrap;
          transition: opacity .35s ease; }
  @media (prefers-reduced-motion: reduce) { #hint { transition: none; } }
  #play {
    position: absolute; right: 14px; bottom: 12px; width: 38px; height: 38px;
    border-radius: 50%; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); cursor: pointer; display: grid; place-items: center; padding: 0;
  }
  #play:hover { border-color: var(--accent); color: var(--accent); }
  #play svg { width: 14px; height: 14px; fill: currentColor; }

  /* Test controls: an icon at the top right that opens a panel below itself.
     A row across the top of the canvas ran out of width at the fourth control
     and began to scroll sideways. A column does not run out, and it has room
     for a name and a reading on every row. */
  #lab { position: absolute; top: 12px; right: 12px; width: 34px; }
  #labToggle {
    width: 34px; height: 34px; padding: 0; cursor: pointer;
    border: 1px solid var(--line); border-radius: 9px;
    background: color-mix(in srgb, var(--panel) 92%, transparent);
    backdrop-filter: blur(6px); color: var(--dim); display: grid; place-items: center;
  }
  #labToggle:hover, #lab:not(.closed) #labToggle { color: var(--accent); border-color: var(--accent); }
  #labToggle svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; }
  #labPanel {
    position: absolute; top: 40px; right: 0; width: 282px; padding: 12px;
    background: color-mix(in srgb, var(--panel) 96%, transparent);
    border: 1px solid var(--line); border-radius: 10px;
    backdrop-filter: blur(8px); display: grid; gap: 13px;
    box-shadow: 0 12px 34px rgb(0 0 0 / .28);
  }
  #lab.closed #labPanel { display: none; }
  .labhead { display: flex; align-items: center; font-size: 10px; font-weight: 600;
             text-transform: uppercase; letter-spacing: .09em; color: var(--dim); }
  .labhead button { width: auto; margin-left: auto; padding: 0 3px; border: 0;
                    background: none; color: var(--dim); font-size: 14px; line-height: 1; }
  .labhead button:hover { color: var(--accent); }
  .labrow { display: grid; gap: 6px; }
  .labrow > span { display: flex; font-size: 10px; color: var(--dim);
                   text-transform: uppercase; letter-spacing: .07em; }
  .labrow > span b { margin-left: auto; color: var(--ink); font-weight: 600;
                     letter-spacing: 0; text-transform: none;
                     font-variant-numeric: tabular-nums; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { flex: 1; width: auto; border: 0; border-radius: 0; padding: 5px 3px;
                background: transparent; color: var(--dim); font-size: 11px; }
  .seg button.on { background: var(--accent); color: #fff; }
  .seg button:hover:not(.on) { color: var(--accent); background: var(--bg); }
  #labPanel input[type=range] { width: 100%; }
  .labchecks { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; }
  .labchecks label { padding: 0; font-size: 11px; }
  button {
    font: inherit; padding: 7px 11px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { opacity: .9; color: #fff; }
  .pill { display: inline-block; padding: 2px 7px; border-radius: 20px;
          font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .detail h3 { margin: 4px 0 2px; font-size: 15px; line-height: 1.3; }
  .id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--dim); }
  .meta { margin: 14px 0; }
  .meta div { display: flex; gap: 10px; padding: 3px 0; border-bottom: 1px solid var(--line); }
  .meta dt { color: var(--dim); width: 74px; flex: none; }
  .meta dd { margin: 0; word-break: break-word; }
  .nb { display: flex; align-items: center; gap: 8px; padding: 5px 7px; border-radius: 5px; cursor: pointer; }
  .nb:hover { background: var(--bg); }
  .nb small { color: var(--dim); margin-left: auto; font-size: 10px; flex: none; }
  .nb.out { opacity: .72; }
  .empty { color: var(--dim); padding-top: 40px; text-align: center; }
  .warn { background: color-mix(in srgb, var(--tm) 14%, transparent);
          border: 1px solid var(--tm); border-radius: 6px; padding: 9px; margin: 12px 0; font-size: 12px; }
  .hold { border: 1px dashed var(--line); border-radius: 6px; padding: 8px 9px;
          margin: 10px 0 4px; color: var(--dim); font-size: 11px; line-height: 1.45; }
  .slider { width: 100%; }
</style>
</head>
<body>

<aside class="left">
  <h1>Example Labs</h1>
  <div class="sub">Five spaces — prototype v2</div>

  <input type="search" id="q" placeholder="Search title or number…" autocomplete="off">
  <div id="results"></div>

  <h2>Spaces</h2>
  <div id="spaces"></div>
  <div class="legend">click a name to centre it<span>nodes · links</span></div>
  <div class="waiting" id="waiting"></div>

  <h2>Link kinds</h2>
  <div id="kinds"></div>

  <h2>Clusters</h2>
  <label><input type="checkbox" id="affinity" checked> Group by shared neighbours</label>
  <label><input type="checkbox" id="bycluster"> Colour by cluster</label>
  <div id="clusterList"></div>

  <h2>View</h2>
  <label><input type="checkbox" id="spin" checked> Rotate slowly</label>
  <label><input type="checkbox" id="flat"> Flatten to 2D</label>
  <label><input type="checkbox" id="labels" checked> Show labels</label>
  <label><input type="checkbox" id="onlyLinked"> Hide nodes with no link here</label>
  <h2>Link opacity</h2>
  <input type="range" class="slider" id="alpha" min="4" max="60" value="26">
  <div style="margin-top:14px"><button id="reset">Reset view</button></div>
</aside>

<main>
  <canvas id="c"></canvas>
  <div id="hud"></div>
  <div id="hint">click a space, or any node in it, to open that space · click the background to come back</div>
  <button id="play" title="Pause rotation (space)"></button>

  <div id="lab" class="closed">
    <button id="labToggle" title="Test controls">
      <svg viewBox="0 0 16 16"><path d="M1 4h14M1 8h14M1 12h14"/>
        <circle cx="5" cy="4" r="1.9" fill="currentColor" stroke="none"/>
        <circle cx="10.5" cy="8" r="1.9" fill="currentColor" stroke="none"/>
        <circle cx="6.5" cy="12" r="1.9" fill="currentColor" stroke="none"/></svg>
    </button>
    <div id="labPanel">
      <div class="labhead"><span>Test controls</span><button id="labClose" title="Close">✕</button></div>

      <div class="labrow"><span>Shell</span>
        <div class="seg" id="shellSeg">
          <button data-shell="none">Off</button>
          <button data-shell="sphere" class="on">Sphere</button>
          <button data-shell="bipyramid">Bipyramid</button>
          <button data-shell="cylinder">Cylinder</button>
        </div>
      </div>

      <div class="labrow"><span>Style</span>
        <div class="seg" id="styleSeg">
          <button data-style="labelled" class="on">Labelled</button>
          <button data-style="obsidian">Obsidian</button>
        </div>
      </div>

      <div class="labrow"><span>Space size <b id="spaceSizeVal">100%</b></span>
        <input type="range" id="spaceSize" min="60" max="170" value="100">
      </div>

      <div class="labrow"><span>Spacing <b id="ringSizeVal">560</b></span>
        <input type="range" id="ringSize" min="360" max="900" value="560">
      </div>

      <div class="labrow"><span>Show</span>
        <div class="labchecks">
          <label><input type="checkbox" id="shells" checked> Shells</label>
          <label><input type="checkbox" id="axes" checked> X-Y axes</label>
          <label><input type="checkbox" id="confine" checked> Confine</label>
        </div>
      </div>
    </div>
  </div>
</main>

<aside class="right"><div id="detail" class="empty">Select a node.</div></aside>

<script>
const GRAPH = /*__GRAPH__*/null;

const TYPE = {
  "standard operating procedure": { key: "SOP",  css: "--sop",  r: 5.5 },
  "form":                         { key: "Form", css: "--form", r: 4.0 },
  "analytical procedure":         { key: "AP",   css: "--ap",   r: 5.0 },
  "test method":                  { key: "TM",   css: "--tm",   r: 4.5 },
  "instrument":                   { key: "Instrument", css: "--inst", r: 6.5 },
};
/* `mag` is how strongly this kind of evidence binds two documents.
   A declared dependency in the RELATED PROCEDURES section is the laboratory
   stating the relationship. A shared thermometer is barely a relationship at
   all. The layout answers to this, so strongly bound documents sit together. */
const KIND = {
  declared:        { label: "Declared (RELATED section)", dash: false, mag: 1.00 },
  "attached form": { label: "Form attached to the SOP",   dash: false, mag: 1.00 },
  mentioned:       { label: "Mentioned in the body",      dash: false, mag: 0.65 },
  title:           { label: "Named by title, no number",  dash: false, mag: 0.55 },
  equipment:       { label: "Uses this instrument",       dash: false, mag: 0.28 },
  asserted:        { label: "Added by hand",              dash: true,  mag: 1.00 },
};
const ORDER = ["declared", "attached form", "mentioned", "title", "equipment"];

/* Resolve CSS custom properties once so canvas can use real colour values. */
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const nodeColor = n => colourBy === "cluster" ? clusterColor(n.id) : COLOR[TYPE[n.type].css];
let COLOR = {};
const readColors = () => {
  COLOR = {};
  for (const s of Object.values(TYPE)) COLOR[s.css] = cssVar(s.css);
  COLOR.ink = cssVar("--ink"); COLOR.bg = cssVar("--bg"); COLOR.dim = cssVar("--dim");
  COLOR.web = cssVar("--web");
};
readColors();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readColors(); draw(); });

const nodes = GRAPH.nodes.map(n => ({ ...n, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0 }));
const byId = new Map(nodes.map(n => [n.id, n]));

/* One line per pair of documents. The line shows the strongest kind of
   evidence, but its magnitude ACCUMULATES every kind found. Two documents
   that declare each other, cite each other in the body, and share an
   instrument are bound three times over, and the layout should say so. */
const pairs = new Map();
for (const l of GRAPH.links) {
  if (!byId.has(l.source) || !byId.has(l.target)) continue;
  const k = [l.source, l.target].sort().join("|");
  const cur = pairs.get(k);
  if (!cur) {
    pairs.set(k, { ...l, s: byId.get(l.source), t: byId.get(l.target),
                   kinds: [l.kind], mag: KIND[l.kind].mag });
  } else {
    if (!cur.kinds.includes(l.kind)) {
      cur.kinds.push(l.kind);
      cur.mag += KIND[l.kind].mag;
      if (ORDER.indexOf(l.kind) < ORDER.indexOf(cur.kind)) cur.kind = l.kind;
    }
  }
}
const edges = [...pairs.values()];

/* Degree and neighbours are counted over EVERY link, not only the ones this
   version draws. A document's weight in the laboratory does not change
   because the viewer holds some of its links back. */
const deg = new Map(nodes.map(n => [n.id, 0]));
for (const e of edges) { deg.set(e.source, deg.get(e.source) + 1); deg.set(e.target, deg.get(e.target) + 1); }
nodes.forEach(n => n.deg = deg.get(n.id));
const nbrs = new Map(nodes.map(n => [n.id, new Set()]));
for (const e of edges) { nbrs.get(e.source).add(e.target); nbrs.get(e.target).add(e.source); }

/* ---------- the five spaces ----------
   Each node type gets a volume of its own, and a node never leaves the volume
   of its class. A link is drawn and simulated only when both its ends are in
   the same volume. Every other link is counted and reported, and waits.

   The order around the ring alternates large and small, so no two big spaces
   sit side by side. */
const SPACE_ORDER = ["standard operating procedure", "test method", "form",
                     "instrument", "analytical procedure"];
const sameSpace = e => e.s.type === e.t.type;
const spaceEdges = edges.filter(sameSpace);
const crossEdges = edges.filter(e => !sameSpace(e));
const MAXMAG = Math.max(...spaceEdges.map(e => e.mag), 1);

/* Neighbours INSIDE the same space. This is what the picture can show, so it
   is what an open node lights up, and what a dragged node carries with it. */
const spaceNbrs = new Map(nodes.map(n => [n.id, new Set()]));
for (const e of spaceEdges) { spaceNbrs.get(e.source).add(e.target); spaceNbrs.get(e.target).add(e.source); }
nodes.forEach(n => n.sdeg = spaceNbrs.get(n.id).size);

const SPACES = {};
SPACE_ORDER.forEach((type, i) => {
  const members = nodes.filter(n => n.type === type);
  SPACES[type] = {
    type, i, key: TYPE[type].key, css: TYPE[type].css,
    n: members.length,
    inside: spaceEdges.filter(e => e.s.type === type).length,
    crossing: crossEdges.filter(e => e.s.type === type || e.t.type === type).length,
    base: Math.max(80, 26 * Math.sqrt(members.length)),
    members,
    r: 0, cx: 0, cy: 0, cz: 0, rep: 900,
    tx: 0, ty: 0, tz: 0,        // where this space is travelling to
  };
});

const RING0 = 560;                   // how far each space sits from the middle
const SPREAD = 2.3;                  // how far the other four go when one opens
let ringR = RING0, sizeK = 1;

/* Where the five volumes sit, and how hard the nodes inside one push apart.

   With no space open the five sit on the ring. Open one and it travels to the
   middle while the other four are pushed out to SPREAD times the ring, which
   is what gets them out of the way.

   The push between nodes is not a fixed number. A cloud of n nodes held by
   gravity g settles at about (2 g R^3 / n)^(1/2) per node, so the constant is
   worked back from the radius the space is meant to fill. Without it a small
   space packs solid and a big one hollows out against its shell. */
function spaceTargets() {
  const step = Math.PI * 2 / SPACE_ORDER.length;
  for (const s of Object.values(SPACES)) {
    const a = -Math.PI / 2 + s.i * step;
    const R = stage ? (s.type === stage ? 0 : ringR * SPREAD) : ringR;
    s.r = s.base * sizeK;
    s.tx = R * Math.cos(a);
    s.ty = flat ? R * Math.sin(a) : 0;
    s.tz = flat ? 0 : R * Math.sin(a);
    const fill = s.r * 0.85;
    s.rep = Math.max(180, Math.min(9000, 2 * 0.0030 * fill * fill * fill / Math.max(4, s.n)));
  }
}

/* Carry each space towards its target, and carry its nodes with it.

   The nodes travel by the same offset as their centre, so a space that moves
   keeps its shape exactly. Nothing is solved again, and nothing inside a space
   is disturbed by another space getting out of the way. */
function moveSpaces(k) {
  let moving = false;
  for (const s of Object.values(SPACES)) {
    let dx = (s.tx - s.cx) * k, dy = (s.ty - s.cy) * k, dz = (s.tz - s.cz) * k;
    if (Math.abs(dx) + Math.abs(dy) + Math.abs(dz) < 0.35) {
      dx = s.tx - s.cx; dy = s.ty - s.cy; dz = s.tz - s.cz;
      if (!dx && !dy && !dz) continue;
    } else moving = true;
    s.cx += dx; s.cy += dy; s.cz += dz;
    for (const n of s.members) { n.x += dx; n.y += dy; n.z += dz; }
  }
  return moving;
}
function placeSpaces() { spaceTargets(); moveSpaces(1); }

/* Affinity: two documents that share many neighbours belong together even if
   neither one names the other. EXL-SOP26 and EXL-SOP30 both hang off the
   balance, the weighing forms and the calibration SOPs; nothing links them
   directly. These pull weakly, so they shape clusters without inventing
   visible links. They are never drawn — only the layout feels them.

   In this version they carry most of the work. The shared neighbour is usually
   in ANOTHER space — two analytical procedures that use the same instrument —
   so affinity is the only force that reaches across the hold and still gives a
   space its shape. Pairs that straddle two spaces are dropped, like the links. */
const affinity = [];
{
  const ids = nodes.filter(n => n.deg >= 2).map(n => n.id);
  const direct = new Set(edges.map(e => [e.source, e.target].sort().join("|")));
  for (let i = 0; i < ids.length; i++) {
    const A = nbrs.get(ids[i]);
    for (let j = i + 1; j < ids.length; j++) {
      const key = [ids[i], ids[j]].sort().join("|");
      if (direct.has(key)) continue;
      const B = nbrs.get(ids[j]);
      let shared = 0;
      for (const x of A) if (B.has(x)) shared++;
      if (shared < 3) continue;
      const jaccard = shared / (A.size + B.size - shared);
      if (jaccard < 0.30) continue;
      affinity.push({ s: byId.get(ids[i]), t: byId.get(ids[j]), mag: jaccard * 0.9 });
    }
  }
  affinity.sort((a, b) => b.mag - a.mag);
  affinity.length = Math.min(affinity.length, 400);   // keep the layout honest
}
const spaceAffinity = affinity.filter(a => a.s.type === a.t.type);

/* Clusters, by weighted label propagation. Each node repeatedly takes the
   label its neighbours hold most strongly. It settles into communities that
   match how the laboratory actually works, not how the folders are named.

   Every link counts here, including the ones the picture holds back, so a
   cluster crosses the spaces. Colour by cluster to see which ones do. */
const cluster = new Map(nodes.map(n => [n.id, n.id]));
{
  const pull = new Map(nodes.map(n => [n.id, []]));
  for (const e of edges) {
    pull.get(e.source).push([e.target, e.mag]);
    pull.get(e.target).push([e.source, e.mag]);
  }
  for (const a of affinity) {
    pull.get(a.s.id).push([a.t.id, a.mag]);
    pull.get(a.t.id).push([a.s.id, a.mag]);
  }
  const order = nodes.map(n => n.id).sort();
  for (let pass = 0; pass < 14; pass++) {
    let changed = 0;
    for (const id of order) {
      const score = new Map();
      for (const [other, w] of pull.get(id))
        score.set(cluster.get(other), (score.get(cluster.get(other)) || 0) + w);
      if (!score.size) continue;
      let best = cluster.get(id), bestV = -1;
      for (const [lab, v] of [...score].sort((a, b) => a[0] < b[0] ? -1 : 1))
        if (v > bestV) { bestV = v; best = lab; }
      if (best !== cluster.get(id)) { cluster.set(id, best); changed++; }
    }
    if (!changed) break;

}
const clusterSizes = new Map();
for (const l of cluster.values()) clusterSizes.set(l, (clusterSizes.get(l) || 0) + 1);
const bigClusters = [...clusterSizes.entries()].filter(([, n]) => n >= 3)
  .sort((a, b) => b[1] - a[1]).map(([l]) => l);
const clusterIndex = new Map(bigClusters.map((l, i) => [l, i]));
const CLUSTER_HUES = [200, 140, 40, 350, 275, 175, 15, 310, 95, 240, 60, 325];
const clusterColor = id => {
  const i = clusterIndex.get(cluster.get(id));
  return i === undefined ? cssVar("--dim") : `hsl(${CLUSTER_HUES[i % CLUSTER_HUES.length]} 62% 58%)`;
};

/* ---------- state ---------- */
const activeSpaces = new Set(Object.keys(TYPE));
const activeKinds = new Set(Object.keys(KIND));
let showLabels = true, hideIsolated = false, flat = false, spin = true;
let selected = null, edgeAlpha = 0.26;
let stage = null;                    // the space that is open, or null for all five
let useAffinity = true, colourBy = "type";
let shellShape = "sphere", confine = true, showShells = true, showAxes = true;
let style = "labelled", hovered = null;
let heldNode = null, holdDepth = 0, coastFrames = 0;
const obs = () => style === "obsidian";

/* The five spaces sit on a ring in the horizontal plane. Seen from the side
   the ring is edge-on and the spaces overlap, so the camera looks down on it
   far enough to read as a ring. One owner for the three places that reset it. */
const PITCH0 = -0.80, DIST0 = 2100;
let yaw = 0.6, pitch = PITCH0, dist = DIST0, zoom = 1, panX = 0, panY = 0;
let look = { x: 0, y: 0, z: 0 };     // the point the camera holds in the middle
let camLook = { x: 0, y: 0, z: 0 };  // where it is going
let camZoom = 1;
const FOCAL = 900;

placeSpaces();

/* ---------- filters ---------- */
const spaceRows = new Map();
function buildSpaceList() {
  const box = document.getElementById("spaces");
  box.innerHTML = "";
  for (const type of SPACE_ORDER) {
    const s = SPACES[type];
    const el = document.createElement("div");
    el.className = "space";
    el.innerHTML = `<input type="checkbox" checked>
      <span class="swatch" style="background:var(${s.css})"></span>
      <span class="nm" title="Centre the view on this space">${s.key}</span>
      <span class="ct">${s.n} · ${s.inside}</span>`;
    el.querySelector("input").onchange = e => {
      e.target.checked ? activeSpaces.add(type) : activeSpaces.delete(type);
      el.classList.toggle("off", !e.target.checked);
      if (!e.target.checked && stage === type) leaveStage();
      settle();
    };
    el.querySelector(".nm").onclick = () => openSpace(type);
    spaceRows.set(type, el);
    box.appendChild(el);
  }
  document.getElementById("waiting").innerHTML =
    `<b>${crossEdges.length}</b> links cross between spaces. None are drawn.
     <b>${spaceEdges.length}</b> stay inside one space.`;

  const k = document.getElementById("kinds");
  for (const [name, spec] of Object.entries(KIND)) {
    const n = spaceEdges.filter(x => x.kind === name).length;
    const held = crossEdges.filter(x => x.kind === name).length;
    const el = document.createElement("label");
    el.title = held ? `${held} more of this kind cross between spaces` : "";
    el.innerHTML = `<input type="checkbox" ${n ? "checked" : "disabled"}>
      <span class="edgekey ${spec.dash ? "dash" : ""}"></span>${spec.label}
      <span class="count">${n}${held ? ` <span style="opacity:.55">+${held}</span>` : ""}</span>`;
    if (!n) activeKinds.delete(name);
    el.querySelector("input").onchange = e => {
      e.target.checked ? activeKinds.add(name) : activeKinds.delete(name);
      settle();

}

let VN = [], VE = [], VA = [], VNby = new Map();
function recompute() {
  VE = spaceEdges.filter(e => activeKinds.has(e.kind) && activeSpaces.has(e.s.type));
  const linked = new Set(VE.flatMap(e => [e.source, e.target]));
  VN = nodes.filter(n => {
    if (!activeSpaces.has(n.type)) return false;
    if (hideIsolated && !linked.has(n.id)) return false;
    return true;
  });
  const set = new Set(VN.map(n => n.id));
  VE = VE.filter(e => set.has(e.source) && set.has(e.target));
  VA = spaceAffinity.filter(a => set.has(a.s.id) && set.has(a.t.id));
  // Repulsion runs inside a space only, so the nodes are grouped once here
  // instead of being tested pair by pair in the inner loop.
  VNby = new Map(SPACE_ORDER.map(t => [t, []]));
  for (const n of VN) VNby.get(n.type).push(n);
}

/* ---------- the shell of one space ----------
   The shell is not decoration. It is the volume that space is allowed to
   occupy, so the shape changes how the nodes inside arrange themselves. A
   sphere spreads them evenly; a bipyramid forces a waist and two poles; a
   cylinder gives a column with flat ends.

   Each shape provides `depth(x, y, z, R)` measured from the space's own
   centre: how far out the point is, as a fraction of the boundary. Below 1 is
   inside. */
const SHELL = {
  sphere: {
    depth: (x, y, z, R) => Math.hypot(x, y, z) / R,
    wire(R) {
      const rings = [];
      for (let i = 1; i <= 5; i++) {                       // lines of latitude
        const phi = (i / 6) * Math.PI, r = R * Math.sin(phi), y = R * Math.cos(phi);
        rings.push(circle(r, y, 40));
      }
      for (let i = 0; i < 4; i++) {                        // lines of longitude
        const a = (i / 4) * Math.PI, pts = [];
        for (let k = 0; k <= 40; k++) {
          const t = (k / 40) * Math.PI * 2;
          pts.push([R * Math.sin(t) * Math.cos(a), R * Math.cos(t), R * Math.sin(t) * Math.sin(a)]);
        }
        rings.push(pts);
      }
      return rings;
    },
  },
  bipyramid: {
    // Hexagonal equator at radius R, apexes at plus and minus 1.35 R on Y.
    depth: (x, y, z, R) => Math.hypot(x, z) / R + Math.abs(y) / (R * 1.35),
    wire(R) {
      const H = R * 1.35, n = 6, eq = [], out = [];
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2;
        eq.push([R * Math.cos(a), 0, R * Math.sin(a)]);
      }
      out.push([...eq, eq[0]]);
      for (const p of eq) { out.push([[0, -H, 0], p]); out.push([p, [0, H, 0]]); }
      return out;
    },
  },
  cylinder: {
    depth: (x, y, z, R) => Math.max(Math.hypot(x, z) / R, Math.abs(y) / (R * 0.95)),
    wire(R) {
      const H = R * 0.95, out = [circle(R, -H, 40), circle(R, H, 40), circle(R, 0, 40)];
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2, x = R * Math.cos(a), z = R * Math.sin(a);
        out.push([[x, -H, z], [x, H, z]]);
      }
      return out;
    },
  },
};
function circle(r, y, seg) {
  const pts = [];
  for (let i = 0; i <= seg; i++) {
    const a = (i / seg) * Math.PI * 2;
    pts.push([r * Math.cos(a), y, r * Math.sin(a)]);
  }
  return pts;
}

/* Push a node back inside its own space. Applied every iteration, so the wall
   between two spaces is a real constraint on the layout and not a line drawn
   afterwards. This is the whole hold: a node cannot reach another space. */
function confineNode(n) {
  const s = SPACES[n.type];
  const dx = n.x - s.cx, dy = n.y - s.cy, dz = n.z - s.cz;
  if (shellShape === "none" || !confine) return;
  const d = SHELL[shellShape].depth(dx, dy, dz, s.r);
  if (d <= 1) return;
  const k = 1 / d;
  n.x = s.cx + dx * k; n.y = s.cy + dy * k; n.z = s.cz + dz * k;
  n.vx *= 0.6; n.vy *= 0.6; n.vz *= 0.6;
}

/* ---------- 3D force layout ---------- */
function spring(e, mag, scale) {
  const dx = e.t.x - e.s.x, dy = e.t.y - e.s.y, dz = e.t.z - e.s.z;
  const d = Math.hypot(dx, dy, dz) || 0.01;
  const m = Math.min(mag, 3);
  // Rest lengths are scaled to the space. A rest length tuned for one volume
  // of 198 nodes is longer than a small space can hold.
  const fit = SPACES[e.s.type].r / 240;
  let rest = (210 / (0.75 + m) + (e.s.sdeg + e.t.sdeg) * 0.5) * fit;
  let k = (0.010 + 0.013 * m) * scale;
  if (obs()) {
    // A node with one or two links is a leaf. Pull it in tight against its
    // hub. Repulsion then spreads the siblings sideways, and the fan that
    // gives this style its look falls out of the two forces together.
    const leaf = Math.min(e.s.sdeg, e.t.sdeg);
    if (leaf <= 2) { rest *= 0.42; k *= 2.2; }
  }
  // A node being dragged grips its neighbours, so they travel with it instead
  // of stretching their links and snapping back afterwards.
  if (heldNode && (e.s === heldNode || e.t === heldNode)) { k *= 3.2; rest *= 0.8; }
  const f = (d - rest) * k;
  const fx = dx / d * f, fy = dy / d * f, fz = dz / d * f;
  e.s.vx += fx; e.s.vy += fy; e.s.vz += fz;
  e.t.vx -= fx; e.t.vy -= fy; e.t.vz -= fz;
}

/* Give a position to nodes that do not have one yet.

   A node arriving because its space was switched on is dropped beside the
   neighbours it already has in that same space, not thrown onto the shell. */
function seedUnplaced(fresh, visible) {
  const totals = new Map();
  for (const n of fresh) totals.set(n.type, (totals.get(n.type) || 0) + 1);
  const seen = new Map();
  for (const n of fresh) {
    const s = SPACES[n.type];
    const anchors = [...spaceNbrs.get(n.id)]
      .map(id => byId.get(id))
      .filter(m => m && m.placed && visible.has(m.id));
    if (anchors.length) {
      let x = 0, y = 0, z = 0;
      for (const a of anchors) { x += a.x; y += a.y; z += a.z; }
      const k = anchors.length, j = 26;
      n.x = x / k + (Math.random() - .5) * j;
      n.y = y / k + (Math.random() - .5) * j;
      n.z = flat ? s.cz : z / k + (Math.random() - .5) * j;
    } else {
      // Nothing to hang off: an even point on this space's own shell.
      const i = seen.get(n.type) || 0;
      seen.set(n.type, i + 1);
      const t = (i + 0.5) / Math.max(1, totals.get(n.type));
      const phi = Math.acos(1 - 2 * t), theta = Math.PI * (1 + Math.sqrt(5)) * i;
      const R = s.r * 0.78;
      n.x = s.cx + R * Math.sin(phi) * Math.cos(theta);
      n.y = s.cy + R * Math.sin(phi) * Math.sin(theta);
      n.z = flat ? s.cz : s.cz + R * Math.cos(phi);
    }
    n.vx = n.vy = n.vz = 0;
    n.placed = true;
  }
}

/* `moving` limits which nodes may change position. Everything still exerts
   force, so new nodes feel the ones already on screen — but the ones already
   on screen do not drift while you are looking at them. */
function layout(iterations, moving) {
  if (!VN.length) return;
  const visible = new Set(VN.map(n => n.id));
  seedUnplaced(VN.filter(n => !n.placed), visible);
  for (let i = 0; i < iterations; i++) step(moving, 1 - i / iterations);
}

/* One relaxation pass. `cool` scales how far anything actually moves, so the
   same code serves a cooling solve and a live drag at constant temperature. */
function step(moving, cool) {
  // Repulsion inside each space. Two spaces never push on each other, so a
  // large space cannot squeeze a small one out of shape.
  for (const [type, group] of VNby) {
    const REP = SPACES[type].rep;
    for (let i = 0; i < group.length; i++) {
      const a = group[i];
      for (let j = i + 1; j < group.length; j++) {
        const b = group[j];
        const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
        const d2 = dx * dx + dy * dy + dz * dz || 0.01;
        const d = Math.sqrt(d2), f = REP / d2;
        const fx = dx / d * f, fy = dy / d * f, fz = dz / d * f;
        a.vx -= fx; a.vy -= fy; a.vz -= fz;
        b.vx += fx; b.vy += fy; b.vz += fz;
      }
    }
  }
  // Springs answer to magnitude: a heavier bond rests shorter and pulls
  // harder, so closeness on screen means strength of association.
  for (const e of VE) spring(e, e.mag, 1);
  if (useAffinity) for (const a of VA) spring(a, a.mag, 0.55);
  for (const n of VN) {
    if (moving && !moving.has(n.id)) { n.vx = n.vy = n.vz = 0; continue; }
    // Gravity pulls to the centre of the node's own space, not to the origin.
    const s = SPACES[n.type];
    n.vx -= (n.x - s.cx) * 0.0030;
    n.vy -= (n.y - s.cy) * 0.0030;
    n.vz -= (n.z - s.cz) * 0.0030;
    n.x += n.vx * cool; n.y += n.vy * cool;
    n.z = flat ? s.cz : n.z + n.vz * cool;
    n.vx *= 0.84; n.vy *= 0.84; n.vz *= 0.84;

/* ---------- camera ---------- */
let W = 0, H = 0, DPR = 1;
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

/* Obsidian's look comes from contrast, not from size: leaves are almost
   points and hubs are large. sqrt(degree) gives that spread without the
   biggest node swamping the view. Degree is the full degree, so a node keeps
   the weight it has in the laboratory even where its links are not drawn. */
function radiusOf(n) {
  if (obs()) return 1.5 + 2.5 * Math.sqrt(n.deg);
  return TYPE[n.type].r + Math.min(6, n.deg * 0.30);
}

function project(n) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const px = n.x - look.x, py = n.y - look.y, pz = n.z - look.z;
  const x1 = px * cy + pz * sy;
  const z1 = -px * sy + pz * cy;
  const y2 = py * cp - z1 * sp;
  const z2 = py * sp + z1 * cp + dist;
  const k = FOCAL / Math.max(60, z2) * zoom;
  return { sx: W / 2 + x1 * k + panX, sy: H / 2 + y2 * k + panY, k, depth: z2 };
}

/* The cursor gives two numbers; a node needs three. Hold the node's camera
   depth fixed and invert the projection for the other two, so the node slides
   in the plane facing the viewer. Rotate the graph and dragging works in a
   different plane, which is how you reach every direction. */
function unproject(sx, sy, depth) {
  const k = FOCAL / Math.max(60, depth) * zoom;
  const x1 = (sx - W / 2 - panX) / k;
  const y2 = (sy - H / 2 - panY) / k;
  const zc = depth - dist;
  const cy = Math.cos(yaw), sy_ = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const y = y2 * cp + zc * sp;
  const z1 = -y2 * sp + zc * cp;
  return { x: x1 * cy - z1 * sy_ + look.x, y: y + look.y, z: x1 * sy_ + z1 * cy + look.z };
}

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

/* ---------- drawing ---------- */
/* The X and Y axes of a space, drawn through its centre and out to its shell.
   They say which way up a space is while it turns, and they give the eye
   something fixed to judge a node's position against. */
const AXES = [
  { v: [1, 0, 0], label: "X", hue: 4 },
  { v: [0, -1, 0], label: "Y", hue: 140 },
];
/* The wall of each space, and its name. The name is drawn even when the wall
   is switched off, because it is the only thing that says which space you are
   looking at.

   The name is placed on the SCREEN, above the space's projected edge, not at a
   point in the world. A point above the shell in world coordinates lands on
   top of the cloud as soon as the camera looks down on the ring. */
let spaceLabels = [];
function drawSpaces() {
  spaceLabels = [];
  for (const type of SPACE_ORDER) {
    if (!activeSpaces.has(type)) continue;
    const s = SPACES[type];
    const p3 = (x, y, z) => project({ x: s.cx + x, y: s.cy + y, z: s.cz + z });
    const col = COLOR[s.css];
    const off = stage && type !== stage ? 0.4 : 1;   // a space that is out of the way

    if (showShells && shellShape !== "none") {
      ctx.strokeStyle = col;
      ctx.lineWidth = 1;
      for (const line of SHELL[shellShape].wire(s.r)) {
        ctx.beginPath();
        line.forEach(([x, y, z], i) => {
          const q = p3(x, y, z);
          i ? ctx.lineTo(q.sx, q.sy) : ctx.moveTo(q.sx, q.sy);
        });
        // Fade the whole line by its average depth so the far side recedes.
        const mid = line[Math.floor(line.length / 2)];
        const q = p3(mid[0], mid[1], mid[2]);
        ctx.globalAlpha = (q.depth > dist ? 0.05 : 0.13) * off;
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    if (showAxes) {
      ctx.lineWidth = 1.3;
      ctx.textAlign = "center";
      ctx.font = "600 10px -apple-system, system-ui, sans-serif";
      for (const ax of AXES) {
        // Each shell depth() is linear in position, so the distance from the
        // centre to the surface along a unit direction is exactly 1/depth(v).
        // The Y axis therefore reaches the bipyramid's apex while X stops at
        // its equator, instead of both running to one shared length.
        const L = shellShape === "none"
          ? s.r
          : 1 / SHELL[shellShape].depth(ax.v[0], ax.v[1], ax.v[2], s.r);
        const o = p3(0, 0, 0);
        const e = p3(ax.v[0] * L, ax.v[1] * L, ax.v[2] * L);
        const w = p3(-ax.v[0] * L, -ax.v[1] * L, -ax.v[2] * L);

        ctx.globalAlpha = 0.5 * off;
        ctx.beginPath(); ctx.moveTo(o.sx, o.sy); ctx.lineTo(e.sx, e.sy); ctx.stroke();
        ctx.globalAlpha = 0.85 * off;
        ctx.fillText(ax.label, e.sx, e.sy - 4);
      }
      ctx.globalAlpha = 1;
    }

    const c = p3(0, 0, 0);
    const x = c.sx, y = c.sy - s.r * c.k - 30;
    const sub = `${s.n} nodes · ${s.inside} links · ${s.crossing} waiting`;
    ctx.textAlign = "center";
    ctx.globalAlpha = Math.max(0.35, 1 - Math.max(0, c.depth - dist) / 1600) * off;
    ctx.lineWidth = 3; ctx.strokeStyle = COLOR.bg;
    ctx.font = "600 13px -apple-system, system-ui, sans-serif";
    ctx.strokeText(s.key, x, y);
    ctx.fillStyle = col;
    ctx.fillText(s.key, x, y);
    spaceLabels.push({ x, y, w: ctx.measureText(s.key).width });
    ctx.font = "11px -apple-system, system-ui, sans-serif";
    ctx.strokeText(sub, x, y + 15);
    ctx.fillStyle = COLOR.dim;
    ctx.fillText(sub, x, y + 15);
    spaceLabels.push({ x, y: y + 15, w: ctx.measureText(sub).width });
    ctx.globalAlpha = 1;
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  // Selection marks one document. It does not hide anything and it does not
  // single out what that document links to.

  drawSpaces();

  for (const n of VN) n.p = project(n);

  // Painter's algorithm: far things first, so near things sit on top.
  const drawn = [...VN].sort((a, b) => b.p.depth - a.p.depth);
  const zs = VN.map(n => n.p.depth);
  const zNear = Math.min(...zs), zFar = Math.max(...zs), span = Math.max(1, zFar - zNear);

  ctx.shadowBlur = 0;
  for (const e of VE) {
    const a = e.s.p, b = e.t.p;
    if (!a || !b) continue;
    const lit = selected !== null && (e.source === selected || e.target === selected);
    const mid = ((a.depth + b.depth) / 2 - zNear) / span;   // 0 near, 1 far
    const off = stage && e.s.type !== stage ? 0.14 : 1;
    // Magnitude shows twice: a stronger bond draws thicker and brighter.
    const m = Math.min(e.mag, MAXMAG) / MAXMAG;
    if (obs()) {
      ctx.globalAlpha = edgeAlpha * (lit ? 2.2 : 0.85) * (1 - mid * 0.55) * off;
      ctx.strokeStyle = lit ? cssVar("--accent") : COLOR.web;
      ctx.lineWidth = (lit ? 1.4 : 0.7) * Math.min(1.3, a.k);
    } else {
      ctx.globalAlpha = edgeAlpha * (0.35 + 1.5 * m) * (lit ? 2.4 : 1) * (1 - mid * 0.65) * off;
      ctx.strokeStyle = lit ? cssVar("--accent") : COLOR.dim;
      ctx.lineWidth = (0.5 + 2.2 * m) * (lit ? 1.6 : 1) * Math.min(1.4, a.k);
    }
    if (KIND[e.kind].dash) ctx.setLineDash([5, 4]); else ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;

  const labels = [];
  for (const n of drawn) {
    const p = n.p;
    const t = (p.depth - zNear) / span;
    const r = radiusOf(n) * p.k;
    const off = stage && n.type !== stage ? 0.30 : 1;
    ctx.globalAlpha = (1 - t * 0.55) * off;

    const col = nodeColor(n);
    // The bloom is what makes a node look lit rather than painted. It grows
    // with degree, so hubs glow and leaves stay as points. The selected node
    // burns a little brighter, which is the only thing selection changes.
    if (obs()) {
      ctx.shadowColor = col;
      ctx.shadowBlur = (4 + Math.min(16, n.deg * 0.9)) * Math.min(1.6, p.k)
                       * (n.id === selected ? 1.4 : 1) * (1 - t * 0.5);
    }
    ctx.beginPath();
    ctx.arc(p.sx, p.sy, Math.max(1.2, r), 0, 6.2832);
    if (n.present === false) {
      ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.setLineDash([2.5, 2.5]);
      ctx.stroke(); ctx.setLineDash([]);
    } else {
      ctx.fillStyle = col; ctx.fill();
      if (obs()) {
        // A second, tighter pass so the centre reads solid through the bloom.
        ctx.shadowBlur = 0;
        ctx.beginPath(); ctx.arc(p.sx, p.sy, Math.max(0.8, r * 0.62), 0, 6.2832);
        ctx.fillStyle = "#fff"; ctx.globalAlpha *= 0.55; ctx.fill();
        ctx.globalAlpha /= 0.55;
      } else {
        ctx.strokeStyle = COLOR.bg; ctx.lineWidth = 1.5 * p.k; ctx.stroke();
      }
    }
    ctx.shadowBlur = 0;
    if (n.id === selected) {
      ctx.strokeStyle = cssVar("--accent"); ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(p.sx, p.sy, r + 5, 0, 6.2832); ctx.stroke();
    }
    /* Two ways a label appears.

       Standing labels are what the "Show labels" checkbox controls. They go by
       full degree, not by degree inside the space: in a space where nothing is
       drawn, the name is the only information a node carries.

       On-demand labels are selection and hover. Those are an explicit request
       for one name, so they ignore the checkbox entirely. */
    const standing = showLabels && !(stage && n.type !== stage) &&
      (obs() ? (n.deg >= 8 || zoom > 1.5) : (n.deg > 4 || zoom > 1.6));
    const onDemand = n.id === selected || n.id === hovered;
    if (standing || onDemand) labels.push({ n, p, t, r, lead: onDemand });
  }

  // Labels last, nearest first, so the closest text wins any overlap.
  ctx.globalAlpha = 1;
  ctx.textAlign = "center";
  // The name of a space is claimed before any node name, so a document label
  // can never sit on top of the word that says which space you are in.
  const taken = [...spaceLabels];
  // Selected and hovered names are claimed first, so a nearer standing label
  // can never push aside the one the user actually asked for.
  labels.sort((a, b) => (b.lead - a.lead) || (a.t - b.t));
  for (const L of labels) {
    const text = (L.n.title || L.n.id).slice(0, 34);
    const size = Math.max(8, Math.min(13, 11 * L.p.k));
    ctx.font = `${L.lead ? "600 " : ""}${size}px -apple-system, system-ui, sans-serif`;
    const w = ctx.measureText(text).width, x = L.p.sx, y = L.p.sy - L.r - 5;
    if (taken.some(b => Math.abs(b.x - x) < (b.w + w) / 2 && Math.abs(b.y - y) < 12)) continue;
    taken.push({ x, y, w });
    ctx.globalAlpha = L.lead ? 1 : 1 - L.t * 0.6;
    ctx.lineWidth = 3; ctx.strokeStyle = COLOR.bg; ctx.strokeText(text, x, y);
    ctx.fillStyle = COLOR.ink; ctx.fillText(text, x, y);
  }
  ctx.globalAlpha = 1;

  // With a space open the readout is about that space. With none open it is
  // about the whole picture. Either way it stays short enough to sit beside
  // the hint without running into it.
  const sel = selected
    ? ` · ${byId.get(selected).id} · ${spaceNbrs.get(selected).size} linked here` : "";
  let text;
  if (stage) {
    const s = SPACES[stage];
    text = `${s.key} space · ${s.n} nodes · ${s.inside} links · ${s.crossing} waiting`;
  } else {
    const held = crossEdges.filter(e => activeSpaces.has(e.s.type) && activeSpaces.has(e.t.type)).length;
    text = `five spaces · ${VN.length} nodes · ${VE.length} links drawn · ${held} waiting`;
  }
  document.getElementById("hud").textContent = text + sel + (flat ? " · 2D" : "");
}

/* Everything the held node is not connected to gets shoved out of the way,
   with the push falling off to nothing at the edge of the wake. Neighbours are
   exempt: they are being pulled in by their springs at the same moment, and
   pushing them too would just fight that. Nodes in other spaces are exempt as
   well — nothing crosses a wall, not even a shove. */
function wake(D) {
  const near = spaceNbrs.get(D.id);
  const R = Math.min(210, SPACES[D.type].r * 0.9), R2 = R * R;
  for (const n of VN) {
    if (n === D || n.type !== D.type || near.has(n.id)) continue;
    const dx = n.x - D.x, dy = n.y - D.y, dz = n.z - D.z;
    const d2 = dx * dx + dy * dy + dz * dz || 0.01;
    if (d2 > R2) continue;
    const d = Math.sqrt(d2);
    const f = 26 * (1 - d / R);
    n.vx += dx / d * f; n.vy += dy / d * f; n.vz += dz / d * f;
  }
}

function physicsFrame() {
  if (heldNode) {
    const moving = new Set(VN.filter(n => n !== heldNode).map(n => n.id));
    wake(heldNode);
    step(moving, 0.6);            // constant temperature while held
    step(moving, 0.6);
    confineNode(heldNode);
    return true;
  }
  if (coastFrames > 0) {
    // Let the graph settle after release instead of freezing mid-motion.
    coastFrames--;
    step(null, 0.5 * (coastFrames / 45));
    return true;
  }
  return false;
}

/* ---------- animation ---------- */
let raf = null;

/* Carry the camera and the spaces towards wherever the last click sent them.
   Opening a space is a move, not a jump: you can see where the space you left
   has gone, so you know how to get back to it. */
function easeCamera() {
  const k = 0.16;
  let moving = moveSpaces(k);
  for (const ax of ["x", "y", "z"]) {
    const d = camLook[ax] - look[ax];
    if (Math.abs(d) > 0.4) { look[ax] += d * k; moving = true; } else look[ax] = camLook[ax];
  }
  const dz = camZoom - zoom;
  if (Math.abs(dz) > 0.004) { zoom += dz * k; moving = true; } else zoom = camZoom;
  return moving;
}

function tick() {
  const busy = physicsFrame();
  const gliding = easeCamera();
  if (spin && !dragging && !heldNode && !flat) yaw += 0.0016;
  if (busy || gliding || (spin && !dragging && !heldNode && !flat)) draw();
  raf = requestAnimationFrame(tick);
}

/* ---------- interaction ---------- */
let dragging = false, last = null, moved = 0;

canvas.addEventListener("mousedown", ev => {
  moved = 0;
  const hit = ev.shiftKey ? null : pick(ev);
  if (hit) {
    // Pressing a node selects it and grabs it. Pressing anywhere else still
    // rotates the view, so both gestures stay available without a modifier.
    heldNode = hit;
    holdDepth = hit.p ? hit.p.depth : dist;
    if (selected !== hit.id) select(hit.id);
    setSpin(false);
    canvas.style.cursor = "grabbing";
    return;
  }
  dragging = true;
  last = { x: ev.clientX, y: ev.clientY, shift: ev.shiftKey };
  canvas.classList.add("grabbing");
});
canvas.addEventListener("mousemove", ev => {
  if (dragging || heldNode) return;
  const h = pick(ev);
  const id = h ? h.id : null;
  if (id !== hovered) { hovered = id; canvas.style.cursor = id ? "pointer" : "grab"; draw(); }
});
canvas.addEventListener("mouseleave", () => { if (hovered) { hovered = null; draw(); } });

window.addEventListener("mousemove", ev => {
  if (heldNode) {
    moved += 6;
    const b = canvas.getBoundingClientRect();
    const q = unproject(ev.clientX - b.left, ev.clientY - b.top, holdDepth);
    heldNode.x = q.x; heldNode.y = q.y;
    heldNode.z = flat ? SPACES[heldNode.type].cz : q.z;
    heldNode.vx = heldNode.vy = heldNode.vz = 0;
    confineNode(heldNode);        // a node cannot be dragged out of its space
    return;                       // the physics frame redraws
  }
  if (!dragging) return;
  const dx = ev.clientX - last.x, dy = ev.clientY - last.y;
  moved += Math.abs(dx) + Math.abs(dy);
  if (last.shift) { panX += dx; panY += dy; }
  else {
    yaw += dx * 0.006;
    pitch = Math.max(-1.45, Math.min(1.45, pitch + dy * 0.006));
  }
  last.x = ev.clientX; last.y = ev.clientY;
  draw();
});
window.addEventListener("mouseup", () => {
  if (heldNode) { heldNode = null; coastFrames = 45; canvas.style.cursor = "grab"; }
  dragging = false;
  canvas.classList.remove("grabbing");
});

canvas.addEventListener("wheel", ev => {
  ev.preventDefault();
  zoom = camZoom = Math.min(8, Math.max(0.25, zoom * Math.exp(-ev.deltaY * 0.0014)));
  draw();
}, { passive: false });

function pick(ev) {
  const b = canvas.getBoundingClientRect();
  const mx = ev.clientX - b.left, my = ev.clientY - b.top;
  let best = null, bestD = 18;
  for (const n of VN) {
    // Only the open space answers to the cursor. The other four are out of the
    // way, and you reach them by clicking their shell.
    if (!n.p || (stage && n.type !== stage)) continue;
    const d = Math.hypot(n.p.sx - mx, n.p.sy - my);
    const r = Math.max(6, radiusOf(n) * n.p.k);
    if (d < Math.max(bestD, r) && (!best || n.p.depth < best.p.depth)) { best = n; }
  }
  return best;
}

/* Which space's shell the cursor is inside, if any. The nearest one wins, so
   a shell in front of another takes the click. */
function pickSpace(ev) {
  const b = canvas.getBoundingClientRect();
  const mx = ev.clientX - b.left, my = ev.clientY - b.top;
  let best = null;
  for (const type of SPACE_ORDER) {
    if (!activeSpaces.has(type)) continue;
    const s = SPACES[type];
    const p = project({ x: s.cx, y: s.cy, z: s.cz });
    if (Math.hypot(p.sx - mx, p.sy - my) > s.r * p.k) continue;
    if (!best || p.depth < best.p.depth) best = { s, p };
  }
  return best && best.s;
}

/* The zoom that makes a ball of this radius fill most of the canvas. */
function fitZoom(R) {
  const fit = 0.42 * Math.min(W, H) * dist / (FOCAL * Math.max(40, R));
  return Math.min(6, Math.max(0.3, fit));
}

/* Show which space is open, and retire the hint once one is. The hint says
   how to get in; when you are in, it is in the way. */
function markStage() {
  for (const [type, el] of spaceRows) el.classList.toggle("open", type === stage);
  document.getElementById("hint").style.opacity = stage ? "0" : "1";
}

/* Open a space. It travels to the middle, the other four go out of the way,
   and it keeps turning, because a space is a thing you look around. */
function openSpace(type) {
  if (stage === type) select(null);   // already here: step back out to the whole space
  stage = type;
  spaceTargets();
  camLook = { x: 0, y: 0, z: 0 };
  camZoom = fitZoom(SPACES[type].r * 1.06);
  panX = panY = 0;
  setSpin(true);
  markStage();
  draw();
}

/* Open a node. A node is a way into its space, and nothing more: the view does
   exactly what it does when you click the shell, and the document goes into
   the panel so you can read it. The camera does not chase the node, and what
   the node links to is not singled out on the canvas. */
function openNode(n) {
  openSpace(n.type);
  select(n.id);
}

/* Back out to the five spaces. */
function leaveStage() {
  stage = null;
  select(null);
  spaceTargets();
  camLook = { x: 0, y: 0, z: 0 };
  camZoom = 1;
  panX = panY = 0;
  setSpin(true);
  markStage();
  draw();
}

/* Rotation is owned in one place, so the canvas, the button and the checkbox
   can never disagree about whether the graph is spinning. */
const PLAY = '<svg viewBox="0 0 16 16"><path d="M4 2.5l9 5.5-9 5.5z"/></svg>';
const PAUSE = '<svg viewBox="0 0 16 16"><path d="M4 2.5h3.2v11H4zM8.8 2.5H12v11H8.8z"/></svg>';
const playBtn = document.getElementById("play");
const spinBox = document.getElementById("spin");

function setSpin(on) {
  spin = on;
  spinBox.checked = on;
  playBtn.innerHTML = on ? PAUSE : PLAY;
  playBtn.title = on ? "Pause rotation (space)" : "Resume rotation (space)";
}

/* The whole mechanism is here. A click means one of three things, and which
   one it means depends only on what is under the cursor.

     a node               open the space it belongs to, and read that document
     a shell, but no node open that space
     neither              go back out to the five spaces */
canvas.addEventListener("click", ev => {
  if (moved > 5) return;               // a rotate is not a click
  const n = pick(ev);
  if (n) { openNode(n); return; }
  const s = pickSpace(ev);
  if (s) { openSpace(s.type); return; }
  leaveStage();
});
playBtn.onclick = () => setSpin(!spin);
window.addEventListener("keydown", ev => {
  if (ev.target.tagName === "INPUT") return;
  if (ev.code === "Space") { ev.preventDefault(); setSpin(!spin); }
  if (ev.code === "Escape") leaveStage();
});

/* ---------- detail panel ---------- */
function select(id) {
  // Rotation is not touched here. Clicking a node does what clicking its shell
  // does, and the space keeps turning until you stop it with the button or the
  // space bar.
  selected = id;
  draw();
  const el = document.getElementById("detail");
  if (!id) { el.className = "empty"; el.textContent = "Select a node."; return; }
  const n = byId.get(id), spec = TYPE[n.type];
  const all = edges.filter(e => e.source === id || e.target === id)
    .map(e => ({ other: byId.get(e.source === id ? e.target : e.source),
                 kind: e.kind, kinds: e.kinds, mag: e.mag }))
    .sort((a, b) => b.mag - a.mag);   // strongest association first
  const here = all.filter(m => m.other.type === n.type);
  const away = all.filter(m => m.other.type !== n.type);

  const row = (m, out) => `<div class="nb ${out ? "out" : ""}" data-go="${m.other.id}">
      <span class="swatch" style="background:var(${TYPE[m.other.type].css})"></span>
      <span>${m.other.title || m.other.id}</span>
      <small>${out ? TYPE[m.other.type].key + " · " : ""}${m.kinds.join(", ")}</small>
      </div>`;

  el.className = "detail";
  el.innerHTML = `
    <span class="pill" style="background:var(${spec.css});color:#fff">${spec.key}</span>
    <h3>${n.title || n.id}</h3>
    <div class="id">${n.id}${n.revision ? " rev " + n.revision : ""}</div>
    ${n.present === false ? `<div class="warn"><b>Not in any folder.</b>
      ${all.length} document${all.length === 1 ? "" : "s"} reference this, but no file exists.</div>` : ""}
    ${n.cls !== "INSTRUMENT" && n.present !== false ? `
    <div class="meta">
      <div><dt>File</dt><dd>${n.file || "—"}</dd></div>
      <div><dt>Revision</dt><dd>${n.revision || "—"}</dd></div>
      <div><dt>Space</dt><dd>${spec.key}</dd></div>
      <div><dt>Links</dt><dd>${here.length} here · ${away.length} away</dd></div>
    </div>
    <button class="primary" id="openbtn">Open in Word</button>` : ""}
    <h2>In the ${spec.key} space — ${here.length}</h2>
    ${here.map(m => row(m, false)).join("") || '<div class="sub" style="padding:0 7px">Nothing.</div>'}
    <h2>Waiting — ${away.length}</h2>
    ${away.length ? `<div class="hold">These links leave the ${spec.key} space.
      This version does not draw them yet. Click one to jump to it.</div>` : ""}
    ${away.map(m => row(m, true)).join("") || '<div class="sub" style="padding:0 7px">Nothing.</div>'}`;

  el.querySelectorAll("[data-go]").forEach(d => d.onclick = () => openNode(byId.get(d.dataset.go)));
  const btn = el.querySelector("#openbtn");
  // The real viewer asks the operating system to open the file. A browser
  // blocks that, so this only proves where the button belongs. Ticket #9.
  if (btn) btn.onclick = () => n.path && window.open("file://" + encodeURI(n.path));
}

/* ---------- controls ---------- */
document.getElementById("q").addEventListener("input", ev => {
  const q = ev.target.value.trim().toLowerCase();
  const box = document.getElementById("results");
  if (!q) { box.innerHTML = ""; return; }
  const hits = nodes.filter(n => (n.title || "").toLowerCase().includes(q) || n.id.toLowerCase().includes(q))
    .sort((a, b) => b.deg - a.deg).slice(0, 12);
  box.innerHTML = hits.map(n => `<div class="hit" data-go="${n.id}">
    <b>${n.title || n.id}</b><span>${n.id} · ${TYPE[n.type].key} · ${n.deg} links</span></div>`).join("")
    || '<div class="sub" style="padding:6px">No match.</div>';
  box.querySelectorAll("[data-go]").forEach(d => d.onclick = () => openNode(byId.get(d.dataset.go)));
});

/* Two kinds of update, deliberately different.

   `settle` is for changing WHAT IS SHOWN. Nodes already on screen keep their
   positions exactly; only nodes arriving for the first time move. Switching a
   space off and on again therefore returns it to where it was.

   `resolve` is for changing THE RULES OF THE SPACE - the shell, the size, the
   ring, 2D, the affinity forces - where every position has to be worked out
   again. */
function settle(iterations = 320) {
  recompute();
  const fresh = new Set(VN.filter(n => !n.placed).map(n => n.id));
  layout(fresh.size ? iterations : 0, fresh);
  draw();
}

function resolve(iterations = 500) {
  placeSpaces();
  nodes.forEach(n => n.placed = false);
  recompute();
  layout(iterations, null);
  draw();
}

spinBox.onchange = e => setSpin(e.target.checked);
document.getElementById("labels").onchange = e => { showLabels = e.target.checked; draw(); };
document.getElementById("flat").onchange   = e => { flat = e.target.checked; pitch = flat ? 0 : PITCH0; yaw = flat ? 0 : 0.6; resolve(); };
document.getElementById("onlyLinked").onchange = e => { hideIsolated = e.target.checked; settle(); };
document.getElementById("alpha").oninput   = e => { edgeAlpha = e.target.value / 100; draw(); };
document.getElementById("affinity").onchange = e => { useAffinity = e.target.checked; resolve(); };

const lab = document.getElementById("lab");
document.getElementById("labToggle").onclick = () => lab.classList.toggle("closed");
document.getElementById("labClose").onclick = () => lab.classList.add("closed");
document.getElementById("shellSeg").onclick = ev => {
  const b = ev.target.closest("[data-shell]");
  if (!b) return;
  shellShape = b.dataset.shell;
  [...b.parentNode.children].forEach(x => x.classList.toggle("on", x === b));
  resolve();
};
document.getElementById("spaceSize").oninput = e => {
  sizeK = e.target.value / 100;
  document.getElementById("spaceSizeVal").textContent = `${e.target.value}%`;
  resolve(260);
};
document.getElementById("ringSize").oninput = e => {
  ringR = +e.target.value;
  document.getElementById("ringSizeVal").textContent = e.target.value;
  resolve(260);
};
document.getElementById("styleSeg").onclick = ev => {
  const b = ev.target.closest("[data-style]");
  if (!b) return;
  style = b.dataset.style;
  [...b.parentNode.children].forEach(x => x.classList.toggle("on", x === b));
  document.documentElement.dataset.style = style;
  readColors();
  // Obsidian's web only reads at low opacity; the labelled style needs more.
  const a = document.getElementById("alpha");
  a.value = obs() ? 18 : 26;
  edgeAlpha = a.value / 100;
  resolve();   // the spring rules changed, so the layout must be re-solved
};
document.getElementById("confine").onchange = e => { confine = e.target.checked; resolve(); };
document.getElementById("shells").onchange = e => { showShells = e.target.checked; draw(); };
document.getElementById("axes").onchange = e => { showAxes = e.target.checked; draw(); };
document.getElementById("bycluster").onchange = e => { colourBy = e.target.checked ? "cluster" : "type"; draw(); };

/* The cluster legend names each community by its heaviest member, which is
   almost always the document the rest of the group hangs off. A cluster is
   worked out from every link, so most of them span more than one space. */
function buildClusterList() {
  const box = document.getElementById("clusterList");
  box.innerHTML = bigClusters.slice(0, 10).map(lab => {
    const members = nodes.filter(n => cluster.get(n.id) === lab);
    const lead = members.slice().sort((a, b) => b.deg - a.deg)[0];
    const spaces = new Set(members.map(m => TYPE[m.type].key)).size;
    const i = clusterIndex.get(lab);
    return `<div class="hit" data-go="${lead.id}" title="${members.length} documents in ${spaces} space(s)">
      <b style="font-size:12px"><span class="swatch" style="display:inline-block;background:hsl(${
        CLUSTER_HUES[i % CLUSTER_HUES.length]} 62% 58%)"></span> ${
        (lead.title || lead.id).slice(0, 26)}</b>
      <span>${members.length} documents · ${spaces} space${spaces === 1 ? "" : "s"}</span></div>`;
  }).join("");
  box.querySelectorAll("[data-go]").forEach(d => d.onclick = () => openNode(byId.get(d.dataset.go)));
}
document.getElementById("reset").onclick = () => {
  stage = null; selected = null; zoom = camZoom = 1; panX = panY = 0;
  look = { x: 0, y: 0, z: 0 }; camLook = { x: 0, y: 0, z: 0 };
  yaw = 0.6; pitch = flat ? 0 : PITCH0; dist = DIST0;
  markStage(); select(null); resolve();
};

buildSpaceList();
buildClusterList();
setSpin(spin);
window.addEventListener("resize", () => { resize(); draw(); });
resize();
recompute();
layout(700, null);
draw();
tick();
</script>
</body>
</html>
